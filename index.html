<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kartu Kata — Hujan Malam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=3" />
  </head>
  <body>
    <canvas id="rainCanvas" aria-hidden="true"></canvas>
    <canvas id="splashCanvas" aria-hidden="true"></canvas>

    <main class="stage">
      <div class="deck">
        <div class="meta-row">
          <button id="editWordsBtn" class="edit-btn" aria-label="Edit kata">
            <svg
              class="edit-icon"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 20h9" />

              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>

            <span class="edit-label edit-label-default">Edit</span>
            <span class="edit-label edit-label-locked">Ubah ke mode portrait</span>
          </button>
          <span class="counter" id="counter">01 / 20</span>
        </div>

        <div
          class="card"
          id="card"
          role="button"
          tabindex="0"
          aria-label="Kartu kata, klik untuk membalik"
        >
          <div class="card-inner" id="cardInner">
            <div class="card-face card-front">
              <span class="face-label">kata</span>
              <p class="word" id="wordEn">Butterfly</p>
              <!--<span class="hint">klik untuk lihat arti</span>-->
            </div>
            <div class="card-face card-back">
              <span class="face-label">arti</span>
              <p class="word word-id" id="wordId">Kupu-kupu</p>
              <!--<span class="hint">klik untuk kembali</span>-->
            </div>
          </div>
        </div>

        <div class="controls">
          <button class="ctrl-btn" id="btnBack" aria-label="Kartu sebelumnya">
            <svg
              class="ctrl-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M15 18l-6-6 6-6" />
            </svg>
            <span class="ctrl-text">&lsaquo; Back</span>
          </button>
          <button
            class="ctrl-btn ctrl-shuffle"
            id="btnShuffle"
            aria-label="Ubah urutan kartu"
          >
            <svg
              class="ctrl-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M16 3h5v5" />
              <path d="M4 20L21 3" />
              <path d="M21 16v5h-5" />
              <path d="M15 15l6 6" />
              <path d="M4 4l5 5" />
            </svg>
            <span class="ctrl-text" id="shuffleLabel">Acak</span>
          </button>
          <button class="ctrl-btn" id="btnNext" aria-label="Kartu berikutnya">
            <svg
              class="ctrl-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 18l6-6-6-6" />
            </svg>
            <span class="ctrl-text">Next &rsaquo;</span>
          </button>
        </div>
      </div>
    </main>

    <!-- ===================================================== -->
    <!-- EDIT WORDS MODAL -->
    <!-- ===================================================== -->

    <div id="editorModal" class="modal">
      <div class="modal-content">
        <h2>Edit Flashcard</h2>

        <p class="modal-tip">
          Masukkan kata baru. Kata dan artinya dipisah dengan tanda koma. Untuk
          kata baru dipisah dengan baris baru.
        </p>

        <textarea
          id="editorTextarea"
          spellcheck="false"
          placeholder="Butterfly,Kupu-kupu&#10;Apple,Apel"
        ></textarea>

        <div class="modal-buttons">
          <button id="cancelEditor">Batal</button>

          <button id="saveEditor">Simpan</button>
        </div>
      </div>
    </div>

    <script src="script.js?v=3"></script>
  </body>
</html>
